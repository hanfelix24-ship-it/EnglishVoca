 <!-- index.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영어 단어 퀴즈 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="start-screen" class="screen active">
    <h1>영어 단어 맞추기</h1>

    <!-- 단어장 선택 UI -->
    <div id="wordbook-selection" style="margin-bottom: 1rem;">
        <strong>단어장 선택:</strong>
        <label>
            <input type="radio" name="wordbook" value="jiseong">
            지성이 단어장
        </label>
        <label>
            <input type="radio" name="wordbook" value="soyeon">
            소연이 단어장
        </label>
    </div>

    <p>
        총 <span id="total-words"></span>개 단어
        <span id="word-range-info" style="font-size: 0.9em; color: #555;"></span>
    </p>

    <div>
        <input type="number" id="start-range" placeholder="시작 ID">
        <input type="number" id="end-range" placeholder="끝 ID">
    </div>
    <button onclick="startGame()">게임 시작</button>
</div>


        <!-- 게임 화면 -->
        <div id="game-screen" class="screen">
            <div class="status-bar">
                <span id="progress-text">문제: 1 / 50</span>
                <span id="score-text">점수: 0</span>
            </div>

            <div class="card">
                <div id="feedback-icon" class="emoji">😐</div>
                <h2 id="english-word">Apple</h2>
                
                <input type="text" id="user-input" placeholder="뜻을 입력하세요 (예: 사과)" autocomplete="off">
                
                <div class="buttons">
                    <button onclick="checkAnswer()" class="btn-primary">정답 확인</button>
                    <button onclick="startVoiceInput()" class="btn-mic">마이크로 말하기 🎤</button>
                </div>
            </div>
        </div>

        <!-- 결과 화면 -->
        <div id="end-screen" class="screen">
            <h1>게임 종료!</h1>
            <div id="final-score" class="emoji">🎉</div>
            <p id="result-message"></p>
            
            <div class="buttons">
                <button onclick="restartGame()">처음부터 다시하기</button>
                <button id="review-btn" onclick="startReview()" class="hidden">틀린 문제만 다시 풀기</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
